version: "3.7"

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    volumes:
      - ./application:/application
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "10924:80"
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    volumes:
      - ./application:/application
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: eireel5Xee5ahKishee9
      MYSQL_DATABASE: muscari
      MYSQL_USER: muscari
      MYSQL_PASSWORD: Zawag3eepheid1eech4H
    volumes:
      - ./db_data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
